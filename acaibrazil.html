<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açaí Brazil - Pedido</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fffaf0; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #4a0e4e; font-size: 3.5em; margin: 0; }
        .header h2 { color: #f2c00f; font-size: 2.5em; margin: -10px 0 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .info-badges { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .badge { padding: 10px 20px; border-radius: 20px; font-weight: bold; color: #d32f2f; border: 2px solid #ccc; background: #fff; }
        .specials { background: #111; color: #f2c00f; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 30px; font-size: 1.2em; font-weight: bold; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .col-1 { grid-column: span 1; }
        .col-2 { grid-column: span 2; }
        .col-3 { grid-column: span 3; }
        
        .box { border: 2px solid #ccc; border-radius: 10px; padding: 15px; position: relative; }
        .box h3 { text-align: center; color: white; margin: -15px -15px 15px -15px; padding: 10px; border-radius: 8px 8px 0 0; text-transform: uppercase; font-size: 1.2em; }
        
        .acai { border-color: #4a0e4e; } .acai h3 { background-color: #4a0e4e; color: #fff; background-image: linear-gradient(#6c1b72, #4a0e4e); }
        .sorvetes { border-color: #4a0e4e; } .sorvetes h3 { background-color: #4a0e4e; background-image: linear-gradient(#6c1b72, #4a0e4e); }
        .acompanhamentos { border-color: #3b8e23; } .acompanhamentos h3 { background-color: #3b8e23; background-image: linear-gradient(#4caf50, #3b8e23); }
        .frutas { border-color: #e62020; } .frutas h3 { background-color: #e62020; background-image: linear-gradient(#f44336, #e62020); }
        .coberturas { border-color: #f28500; } .coberturas h3 { background-color: #f28500; background-image: linear-gradient(#ff9800, #f28500); }
        .tamanhos { border-color: #1a4b8c; grid-column: span 3; } .tamanhos h3 { background-color: #1a4b8c; background-image: linear-gradient(#2196f3, #1a4b8c); }
        
        .flex-col { display: flex; flex-direction: column; gap: 10px; }
        .tamanhos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        label { display: flex; align-items: center; padding: 5px 0; border-bottom: 1px dashed #eee; cursor: pointer; transition: 0.2s; }
        label:hover { background-color: #f9f9f9; }
        input[type="checkbox"], input[type="radio"] { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        .price { margin-left: auto; font-weight: bold; color: #555; }
        .extra { color: #d32f2f; }
        
        button { width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold; color: #fff; background-color: #3b8e23; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.3s; }
        button:hover { background-color: #2c6b19; transform: translateY(-2px); }
        
        .btn-copiar { background-color: #1a4b8c; }
        .btn-copiar:hover { background-color: #123563; }
        
        #relatorio { display: none; margin-top: 40px; padding: 30px; border: 2px solid #4a0e4e; border-radius: 15px; background-color: #fafafa; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        #relatorio h2 { color: #4a0e4e; text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .resumo-item { margin-bottom: 10px; font-size: 1.1em; }
        .resumo-item span { font-weight: bold; }
        .total { font-size: 2em; font-weight: bold; color: #1a4b8c; text-align: right; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
            .col-2, .col-3, .tamanhos { grid-column: span 1; }
            .tamanhos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Açaí Brazil</h1>
        <h2>Escolha tudo o que quiser!</h2>
    </div>

    <div class="info-badges">
        <div class="badge">🍓 FRUTAS INCLUÍDAS</div>
        <div class="badge">🍵 ACOMPANHAMENTOS INCLUÍDOS</div>
        <div class="badge">🍯 COBERTURAS INCLUÍDAS</div>
    </div>

    <div class="specials">
        ⭐ Itens Especiais: Ganache (+R$ 3,00) | Creme de Avelã (+R$ 5,00)
    </div>

    <form id="pedidoForm">
        <div class="grid-container">
            
            <div class="flex-col">
                <div class="box acai">
                    <h3>Açaí</h3>
                    <label><input type="radio" name="acai" value="Sim" checked> Sim</label>
                    <label><input type="radio" name="acai" value="Não"> Não</label>
                </div>

                <div class="box sorvetes">
                    <h3>Sorvetes</h3>
                    <label><input type="checkbox" name="sorvetes" value="Frozen"> Frozen</label>
                    <label><input type="checkbox" name="sorvetes" value="Cupuaçu"> Cupuaçu</label>
                    <label><input type="checkbox" name="sorvetes" value="Morango"> Morango</label>
                    <label><input type="checkbox" name="sorvetes" value="Kiwi"> Kiwi</label>
                    <label><input type="checkbox" name="sorvetes" value="Blueberry"> Blueberry</label>
                    <label><input type="checkbox" name="sorvetes" value="Tapioca de Coco"> Tapioca de Coco</label>
                    <label><input type="checkbox" name="sorvetes" value="Maracujá"> Maracujá</label>
                    <label><input type="checkbox" name="sorvetes" value="Ninho c/ Nutella"> Ninho c/ Nutella</label>
                    <label><input type="checkbox" name="sorvetes" value="Brigadeiro"> Brigadeiro</label>
                </div>
            </div>

            <div class="box acompanhamentos">
                <h3>Acompanhamentos</h3>
                <label><input type="checkbox" name="acomps" value="Leite Ninho"> Leite Ninho</label>
                <label><input type="checkbox" name="acomps" value="Paçoca"> Paçoca</label>
                <label><input type="checkbox" name="acomps" value="Ovomaltine"> Ovomaltine</label>
                <label><input type="checkbox" name="acomps" value="Amendoim"> Amendoim</label>
                <label><input type="checkbox" name="acomps" value="Granola"> Granola</label>
                <label><input type="checkbox" name="acomps" value="Coco Ralado"> Coco Ralado</label>
                <label><input type="checkbox" name="acomps" value="Sucrilhos"> Sucrilhos</label>
                <label><input type="checkbox" name="acomps" value="Granulado"> Granulado</label>
                <label><input type="checkbox" name="acomps" value="Confete"> Confete</label>
            </div>

            <div class="flex-col">
                <div class="box frutas">
                    <h3>Frutas</h3>
                    <label><input type="checkbox" name="frutas" value="Banana"> Banana</label>
                    <label><input type="checkbox" name="frutas" value="Uva"> Uva</label>
                    <label><input type="checkbox" name="frutas" value="Abacaxi"> Abacaxi</label>
                    <label><input type="checkbox" name="frutas" value="Morango"> Morango</label>
                    <label><input type="checkbox" name="frutas" value="Manga"> Manga</label>
                    <label><input type="checkbox" name="frutas" value="Kiwi"> Kiwi</label>
                </div>

                <div class="box coberturas">
                    <h3>Coberturas</h3>
                    <label><input type="checkbox" name="coberturas" value="Doce de Leite"> Doce de Leite</label>
                    <label><input type="checkbox" name="coberturas" value="Mel"> Mel</label>
                    <label><input type="checkbox" name="coberturas" value="Leite Condensado"> Leite Condensado</label>
                    <label><input type="checkbox" name="coberturas" value="Ganache" data-price="3.00"> Ganache <span class="price extra">+R$ 3,00</span></label>
                    <label><input type="checkbox" name="coberturas" value="Creme de Avelã" data-price="5.00"> Creme de Avelã <span class="price extra">+R$ 5,00</span></label>
                </div>
            </div>

            <div class="box tamanhos">
                <h3>Tamanhos</h3>
                <div class="tamanhos-grid">
                    <label><input type="radio" name="tamanho" value="Copo P (177ml)" data-price="15.00" required> Copo P (177ml) <span class="price">R$ 15,00</span></label>
                    <label><input type="radio" name="tamanho" value="Marmitex XG (750ml)" data-price="45.00"> Marmitex XG (750ml) <span class="price">R$ 45,00</span></label>
                    <label><input type="radio" name="tamanho" value="Copo M (300ml)" data-price="25.00"> Copo M (300ml) <span class="price">R$ 25,00</span></label>
                    <label><input type="radio" name="tamanho" value="Marmitex Mega (1.100L)" data-price="55.00"> Marmitex Mega (1.100L) <span class="price">R$ 55,00</span></label>
                    <label><input type="radio" name="tamanho" value="Copo G (500ml)" data-price="28.00"> Copo G (500ml) <span class="price">R$ 28,00</span></label>
                </div>
            </div>

        </div>

        <button type="button" onclick="gerarRelatorio()">GERAR RELATÓRIO DO PEDIDO</button>
    </form>

    <div id="relatorio">
        <h2>🧾 Resumo do Pedido</h2>
        <div id="resumo-conteudo"></div>
        <div class="total" id="total-pedido">Total: R$ 0,00</div>
        
        <!-- O Novo Botão Inútil -->
        <button type="button" class="btn-copiar" id="btnCopiar" onclick="copiarPedido()">📋 COPIAR PEDIDO PARA O WHATSAPP</button>
    </div>
</div>

<script>
    let textoPedidoAreaTransferencia = "";

    function getCheckedValues(name) {
        const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
        return Array.from(checkboxes).map(cb => cb.value);
    }

    function gerarRelatorio() {
        const tamanhoSelecionado = document.querySelector('input[name="tamanho"]:checked');
        
        if (!tamanhoSelecionado) {
            alert("Por favor, selecione suas opções.");
            return;
        }

        const acai = document.querySelector('input[name="acai"]:checked').value;
        const sorvetes = getCheckedValues("sorvetes");
        const acomps = getCheckedValues("acomps");
        const frutas = getCheckedValues("frutas");
        
        const coberturasElements = document.querySelectorAll('input[name="coberturas"]:checked');
        let coberturas = [];
        let total = parseFloat(tamanhoSelecionado.getAttribute('data-price'));
        
        coberturasElements.forEach(cb => {
            coberturas.push(cb.value);
            if (cb.getAttribute('data-price')) {
                total += parseFloat(cb.getAttribute('data-price'));
            }
        });

        // HTML para a tela
        let html = `<div class="resumo-item"><span>Tamanho:</span> ${tamanhoSelecionado.value}</div>`;
        html += `<div class="resumo-item"><span>Açaí:</span> ${acai}</div>`;
        
        // Texto puro para copiar
        textoPedidoAreaTransferencia = `*Pedido Açaí Brazil*\n`;
        textoPedidoAreaTransferencia += `Tamanho: ${tamanhoSelecionado.value}\n`;
        textoPedidoAreaTransferencia += `Açaí: ${acai}\n`;

        if (sorvetes.length > 0) {
            html += `<div class="resumo-item"><span>Sorvetes:</span> ${sorvetes.join(", ")}</div>`;
            textoPedidoAreaTransferencia += `Sorvetes: ${sorvetes.join(", ")}\n`;
        }
        if (acomps.length > 0) {
            html += `<div class="resumo-item"><span>Acompanhamentos:</span> ${acomps.join(", ")}</div>`;
            textoPedidoAreaTransferencia += `Acompanhamentos: ${acomps.join(", ")}\n`;
        }
        if (frutas.length > 0) {
            html += `<div class="resumo-item"><span>Frutas:</span> ${frutas.join(", ")}</div>`;
            textoPedidoAreaTransferencia += `Frutas: ${frutas.join(", ")}\n`;
        }
        if (coberturas.length > 0) {
            html += `<div class="resumo-item"><span>Coberturas:</span> ${coberturas.join(", ")}</div>`;
            textoPedidoAreaTransferencia += `Coberturas: ${coberturas.join(", ")}\n`;
        }

        const strTotal = `R$ ${total.toFixed(2).replace('.', ',')}`;
        textoPedidoAreaTransferencia += `*Total: ${strTotal}*\n`;

        document.getElementById('resumo-conteudo').innerHTML = html;
        document.getElementById('total-pedido').innerText = `Total: ${strTotal}`;
        document.getElementById('relatorio').style.display = 'block';
        
        document.getElementById('relatorio').scrollIntoView({ behavior: 'smooth' });
        
        document.getElementById('btnCopiar').innerText = "📋 COPIAR PEDIDO PARA O WHATSAPP";
    }

    function copiarPedido() {
        if (!textoPedidoAreaTransferencia) return;
        
        navigator.clipboard.writeText(textoPedidoAreaTransferencia).then(() => {
            const btn = document.getElementById('btnCopiar');
            btn.innerText = "✅ COPIADO";
            setTimeout(() => {
                btn.innerText = "📋 COPIAR PEDIDO PARA O WHATSAPP";
            }, 3000);
        }).catch(err => {
            alert("Erro ao copiar.");
        });
    }
</script>
</body>
</html>
